<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Cadence · Focused Routine & Reflection Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <div class="head-row">
            <h1>Cadence</h1>
            <div>
                <button class="icon-btn" onclick="showView('history')">📅</button>
                <button class="icon-btn" onclick="showView('setup')">⚙️</button>
            </div>
        </div>

        <div class="chip-scroll" id="chipContainer"></div>

        <div class="card">
            <div id="welcomeView">
                <div style="text-align:center; padding:30px 0;">
                    <div class="app-icon" style="margin-bottom:20px;">
                        <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="36" cy="36" r="32" stroke="#007aff" stroke-width="2.5" fill="none"/>
                            <circle cx="36" cy="36" r="24" stroke="#007aff" stroke-width="1.5" opacity="0.4" fill="none"/>
                            <circle cx="36" cy="36" r="4" fill="#007aff"/>
                            <line x1="36" y1="36" x2="36" y2="18" stroke="#007aff" stroke-width="2" stroke-linecap="round"/>
                            <line x1="36" y1="36" x2="50" y2="36" stroke="#007aff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                        </svg>
                    </div>
                    <div id="welcomeGrid"></div>
                </div>
            </div>

            <div id="loggerView" class="hidden">
                <div class="logger-header">
                    <span id="ctxName" style="font-size:18px; font-weight:600;">Context</span>
                    <span id="stepText" style="font-size:12px; color:#86868b;">0/0</span>
                </div>

                <div id="resumeBanner" style="background:#f0f7ff; padding:10px; margin-bottom:15px; border-radius:12px; display:none; text-align:center;">
                    <span style="font-size:13px; color:#007aff;">Session restored.</span>
                    <button onclick="resetProgress()" style="border:none; background:none; text-decoration:underline; color:#007aff; font-size:13px;">Restart?</button>
                </div>

                <div class="question" id="questionText">loading...</div>
                <div class="input-area" id="inputArea"></div>
                <div class="button-row">
                    <button onclick="handleBack()">←</button>
                    <button id="skipBtn" onclick="handleSkip()">Skip</button>
                    <button class="primary" onclick="handleNext()">Next →</button>
                </div>
            </div>

            <div id="historyView" class="hidden">
                <div class="head-row">
                    <span style="font-size:18px; font-weight:600;">History</span>
                    <button class="icon-btn" onclick="showView('welcome')">✕</button>
                </div>
                <input type="search" id="searchInput" placeholder="Search logs..." oninput="searchHistory()" style="margin-bottom:20px;">

                <div id="calendar" class="calendar"></div>
                <div id="historyEntries"></div>

                <button id="dayDownloadBtn" class="download-btn hidden" onclick="downloadCurrentDay()">📥 Download This Day</button>
                <div style="margin-top:16px; display:flex; gap:10px;">
                    <button class="download-btn" style="flex:1; padding:12px; font-size:14px;" onclick="exportHistoryCSV()">📊 Export CSV</button>
                    <button class="download-btn" style="flex:1; padding:12px; font-size:14px; background:#34c759;" onclick="exportHistoryMarkdown()">📝 Export Markdown</button>
                </div>
            </div>

            <div id="setupView" class="hidden">
                <div class="head-row">
                    <span style="font-size:18px; font-weight:600;">Settings</span>
                    <button class="icon-btn" onclick="showView('welcome')">✕</button>
                </div>
                <div id="autoSaveIndicator" style="text-align:right; font-size:11px; color:#34c759; margin-bottom:10px; opacity:0;">✓ Saved</div>

                <div class="section-header" onclick="toggleSection('assignments')">
                    <span class="section-title">🔗 Tab Assignments</span>
                    <span id="assignmentsToggle">▼</span>
                </div>
                <div id="assignmentsSection" class="section-content">
                    <div id="assignmentEditor"></div>
                </div>

                <div class="section-header" onclick="toggleSection('bank')">
                    <span class="section-title">📋 Question Bank</span>
                    <span id="bankToggle">▶</span>
                </div>
                <div id="bankSection" class="section-content collapsed">
                    <button class="download-btn" style="margin-top:0; margin-bottom:16px;" onclick="addToBank()">+ Create New Question</button>

                    <div class="accordion-item" style="border:none;">
                        <div class="accordion-header" style="background:#e8e8ed; border-radius:12px;" onclick="toggleItemExpand('bankList')">
                            <span>Edit Existing Questions</span>
                            <span id="bankListIcon">▶</span>
                        </div>
                        <div id="bankListBody" class="accordion-body hidden">
                            <div id="bankEditor"></div>
                        </div>
                    </div>
                </div>

                <div class="section-header" onclick="toggleSection('contexts')">
                    <span class="section-title">📌 Manage Tabs</span>
                    <span id="contextsToggle">▶</span>
                </div>
                <div id="contextsSection" class="section-content collapsed">
                    <div id="contextEditor"></div>
                    <button class="download-btn" onclick="addContext()">+ New Tab</button>
                </div>

                <div style="margin-top:30px; border-top:1px solid #eee; padding-top:20px;">
                    <h3 style="margin-bottom:8px;">💾 Backup</h3>
                    <button class="download-btn" style="background:#34c759;" onclick="exportBackup()">📤 Export Backup</button>
                    <div style="margin-top:10px;">
                        <input type="file" id="importFile" style="display:none" onchange="importBackup(this)">
                        <button class="download-btn" style="background:#f5f5f7; color:#333; border:1px solid #ddd;" onclick="document.getElementById('importFile').click()">📥 Import Backup</button>
                    </div>
                    <div style="margin-top:20px; padding-top:16px; border-top:1px solid #e8e8ed;">
                        <h4 style="margin-bottom:12px; font-size:14px; color:#666;">📋 Template Sharing</h4>
                        <div style="display:flex; gap:10px; margin-bottom:10px;">
                            <button class="download-btn" style="flex:1; padding:12px; font-size:14px; background:#ff9f0a;" onclick="exportTemplate()">📤 Export Template</button>
                        </div>
                        <div style="display:flex; gap:10px;">
                            <input type="file" id="templateFile" style="display:none" onchange="importTemplate(this)">
                            <button class="download-btn" style="flex:1; padding:12px; font-size:14px; background:#f5f5f7; color:#333; border:1px solid #ddd;" onclick="document.getElementById('templateFile').click()">📥 Import Template</button>
                        </div>
                    </div>
                    <div style="margin-top:20px; padding-top:16px; border-top:1px solid #e8e8ed;">
                        <h4 style="margin-bottom:12px; font-size:14px; color:#666;">Export History</h4>
                        <div style="display:flex; gap:10px;">
                            <button class="download-btn" style="flex:1; padding:12px; font-size:14px;" onclick="exportHistoryCSV()">📊 Export CSV</button>
                            <button class="download-btn" style="flex:1; padding:12px; font-size:14px; background:#34c759;" onclick="exportHistoryMarkdown()">📝 Export Markdown</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-card">
            <div id="modalTitle" style="font-weight:600; margin-bottom:10px;"></div>
            <div id="modalBody" style="color:#666; margin-bottom:20px;"></div>
            <div class="modal-buttons">
                <button id="modalCancel" style="background:#f5f5f7;">Cancel</button>
                <button id="modalConfirm" style="background:#007aff; color:white;">OK</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
